name: Cycode
description: >-
  Cycode is a complete Application Security Posture Management (ASPM) and software
  supply chain security platform that delivers visibility, security, and integrity
  across the entire software development lifecycle. Its Risk Intelligence Graph
  (RIG) correlates findings from SAST, SCA, secrets, IaC, and container scanning
  into a single risk model. Cycode exposes a REST API and webhooks, an official
  command-line interface (the `cycode` CLI for pip/Homebrew), and an official
  Model Context Protocol (MCP) server for AI-assisted scanning. Founded in 2019
  and backed by Insight Partners, Cycode is certified SOC 2 Type II, ISO 27001,
  and CSA STAR Level 1. This profile was enriched by the API Evangelist pipeline.
